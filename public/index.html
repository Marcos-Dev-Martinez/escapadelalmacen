function gHunt(){
  const total=GAME.hunt.filter(h=>h.bad).length;
  M={kind:'hunt',found:new Set(),total};
  panel('Busca los peligros','Mesa de reparación · orden y electricidad',
    `En esta zona del taller hay <b>${total} cosas que incumplen las normas</b>. Púlsalas. Ojo: si marcas algo que está bien, pierdes ${GAME.penalty} s.`,
    `<div class="hunt" id="hunt">${HUNT_SVG}</div><div class="huntbar"><span>Encontrados: <b id="hfound">0 / ${total}</b></span><span id="hlast"></span></div>`);
  document.querySelectorAll('#hunt .hz').forEach(g=>{ g.onclick=()=>pickHazard(g); g.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); pickHazard(g); } }; });
}
function pickHazard(g){
  if(M.kind!=='hunt'||M.done) return; const h=GAME.hunt.find(x=>x.id===g.dataset.id);
  if(h.bad){ if(M.found.has(h.id)) return; M.found.add(h.id); g.classList.add('found'); SFX.ok(); $('#hfound').textContent=`${M.found.size} / ${M.total}`;
    if(M.found.size===M.total) return win('hunt');
    tip('✓ Encontrado',`<b>${h.name}.</b> ${h.why}`); }
  else { g.classList.add('miss'); setTimeout(()=>g.classList.remove('miss'),700); penalize(); fb(false,h.why); }
}

/* Extra · Botiquín: marcar lo que tiene que llevar como mínimo (suma tiempo) */
function gKit(){
  const all=[...GAME.kit.right.map(t=>({t,ok:true})),...GAME.kit.wrong.map(t=>({t,ok:false}))].sort(()=>Math.random()-.5);
  M={kind:'kit',all,sel:new Set()};
  panel('¿Qué lleva el botiquín?','Prueba extra · primeros auxilios',
    `Prueba opcional. Marca lo que la ley dice que tiene que haber <b>como mínimo</b> en el botiquín y pulsa «Comprobar». Cada acierto suma <b>+${GAME.kit.bonus} s</b>; fallar no resta. Teclas 1–8.`,
    `<div class="grid2" id="opts">${all.map((o,k)=>`<button type="button" class="chip" data-k="${k}" aria-pressed="false"><span class="k">${k+1}</span><span>${o.t}</span></button>`).join('')}</div>`);
  $('#act').innerHTML=`<button class="btn" type="button" id="check">Comprobar <kbd>Intro</kbd></button>`; $('#check').onclick=checkKit;
  document.querySelectorAll('#opts .chip').forEach(b=>b.onclick=()=>toggleKit(b));
}
function toggleKit(b){ if(M.kind!=='kit'||M.done) return; const k=+b.dataset.k; M.sel.has(k)?M.sel.delete(k):M.sel.add(k); b.classList.toggle('sel'); b.setAttribute('aria-pressed',M.sel.has(k)); SFX.tap(); }
function checkKit(){
  if(M.kind!=='kit'||M.done) return;
  if(!M.sel.size){ tip('Primero','Marca al menos una cosa.'); return; }
  const got=[...M.sel].filter(k=>M.all[k].ok).length;
  document.querySelectorAll('#opts .chip').forEach(b=>{ const o=M.all[+b.dataset.k]; if(o.ok) b.className='chip right'; else if(M.sel.has(+b.dataset.k)) b.className='chip wrong'; else b.style.opacity=.4; });
  M.done=true; S.bonus=got*GAME.kit.bonus; S.left+=S.bonus; if(S.bonus){ SFX.ok(); bonusFlash(S.bonus); } else SFX.ko();
  fb(true,`Has acertado <b>${got} de ${GAME.kit.right.length}</b>: <b>+${S.bonus} s</b>. ${GAME.kit.learn}<small>Fuente: ${GAME.kit.source}</small>`);
  $('#act').innerHTML=`<button class="btn green" type="button" id="take">Volver a la sala <kbd>Espacio</kbd></button>`;
  M.take=()=>{ S.open=null; M={}; closePanel(); drawRoom(); }; $('#take').onclick=M.take; $('#take').focus();
}

/* 5 · Puerta: teclear el código y abrir hacia el lado correcto */
function gDoor(){
  const n=Object.keys(S.digits).length;
  if(n<SC.rooms.length){
    const miss=SC.rooms.filter(r=>S.digits[r.id]==null).map(r=>r.name.toLowerCase());
    M={}; panel('Puerta de emergencia','Salida · candado cerrado',`Al candado le faltan <b>${SC.rooms.length-n}</b> cifras. Te queda: ${miss.join(', ')}.`,''); S.open=null; return;
  }
  if(S.unlocked){ doorPush(); return; }
  M={kind:'code',typed:''};
  const code=SC.rooms.map(r=>dig(r)).join('');
  panel('Abre el candado','Salida · candado','Teclea el código en el orden del candado de arriba. Puedes usar el teclado numérico.',
    `<div class="doorgame"><div class="keypad" id="kp">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(v=>`<button type="button" data-v="${v}">${v}</button>`).join('')}</div>
     <div style="display:grid;gap:14px"><div class="code" id="code">${'<span></span>'.repeat(SC.rooms.length)}</div></div></div>`);
  M.code=code; document.querySelectorAll('#kp button').forEach(b=>b.onclick=()=>key(b.dataset.v));
}
function key(v){
  if(M.kind!=='code') return;
  if(v==='⌫') M.typed=M.typed.slice(0,-1);
  else if(v==='✓') return checkCode();
  else if(M.typed.length<M.code.length) M.typed+=v;
  [...$('#code').children].forEach((s,i)=>s.textContent=M.typed[i]||''); SFX.key();
  if(M.typed.length===M.code.length) setTimeout(checkCode,250);
}
function checkCode(){
  if(M.kind!=='code'||M.typed.length<M.code.length) return;
  if(M.typed===M.code){ S.unlocked=true; drawHud(); SFX.unlock(); doorPush(); }
  else { penalize(); $('#code').classList.remove('shake'); void $('#code').offsetWidth; $('#code').classList.add('shake'); fb(false,'Código incorrecto. Míralo en el candado de arriba.'); M.typed=''; setTimeout(()=>{ if(M.kind==='code'&&M.typed==='') [...$('#code').children].forEach(s=>s.textContent=''); },400); }
}
function doorPush(){
  M={kind:'push'};
  panel('¡Candado abierto!','Salida · última prueba',`${SC.door.q} Teclas 1–${SC.door.opts.length}.`,
    `<div class="grid2" id="opts" style="grid-template-columns:repeat(${SC.door.opts.length},minmax(0,1fr))">
      ${SC.door.opts.map((o,k)=>`<button type="button" class="chip" data-k="${k}"><span class="k">${k+1}</span><span>${o.t}</span></button>`).join('')}</div>`);
  document.querySelectorAll('#opts .chip').forEach(b=>b.onclick=()=>push(b));
}
function push(b){
  if(M.done) return; const o=SC.door.opts[+b.dataset.k];
  if(o.ok){ M.done=true; b.className='chip right'; SFX.unlock(); fb(true,`${SC.door.learn}<small>Fuente: ${SC.door.source}</small>`);
    S.running=false; $('#act').innerHTML=`<button class="btn green" type="button" id="take">${SC.door.exit} <kbd>Espacio</kbd></button>`;
    M.take=()=>{S.open=null; stopAllSound(); go('win'); SFX.creak(); SFX.fanfare();}; $('#take').onclick=M.take; $('#take').focus(); }
  else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake','wrong'); penalize(); fb(false,o.why); }
}

/* ======================= CONTROLES ======================= */
function reset(){ const snd=S.sound; stopAllSound(); closePanel(); S=fresh(); S.sound=snd; M={}; closeOverlay(); setPauseLayer(); render(); }
function setPauseLayer(){ let l=$('#pauseLayer');
  if(S.paused){ if(!l){ l=document.createElement('button'); l.type='button'; l.id='pauseLayer'; l.className='pauselayer';
      l.innerHTML='<span>En pausa</span><small>Pulsa aquí o la tecla P para seguir</small>'; l.onclick=togglePause; document.body.appendChild(l); } }
  else l?.remove();
  $('#bPause').setAttribute('aria-pressed',S.paused); }
function togglePause(){ if(!S.running) return; S.paused=!S.paused; setPauseLayer(); S.paused?musicStop():musicStart(); }
function toggleSound(){ S.sound=!S.sound; $('#bSound').setAttribute('aria-pressed',S.sound); audio(); if(A.master) A.master.gain.setTargetAtTime(S.sound?1:0,A.ctx.currentTime,.05); if(S.sound) SFX.tap(); }
function toggleFull(){ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} }
let overlay=null, confirmReset=false;
function closeOverlay(){ overlay?.remove(); overlay=null; confirmReset=false; }
function showHelp(){ closeOverlay(); overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="box" role="dialog" aria-label="Atajos"><h2 style="font-size:clamp(26px,2.6vw,44px)">Atajos de teclado</h2><dl class="keys">
  <dt><kbd>1 · 2</kbd></dt><dd>En la portada: elegir sala</dd><dt><kbd>Espacio</kbd></dt><dd>Guardar la cifra · continuar · mantener para descargar el extintor</dd><dt><kbd>1–6</kbd></dt><dd>En la sala: abrir cada objeto (5 = salida, 6 = extra)</dd>
  <dt><kbd>1–8</kbd></dt><dd>Dentro de una prueba: elegir opción</dd><dt><kbd>Intro</kbd></dt><dd>Comprobar</dd><dt><kbd>← ↑ → ↓</kbd></dt><dd>Correr por la vía de evacuación hasta el siguiente cruce</dd>
  <dt><kbd>Esc</kbd></dt><dd>Volver a la sala</dd><dt><kbd>P</kbd></dt><dd>Pausar el tiempo</dd><dt><kbd>S</kbd></dt><dd>Sonido</dd><dt><kbd>F</kbd></dt><dd>Pantalla completa</dd>
  <dt><kbd>R</kbd></dt><dd>Reiniciar</dd></dl><button class="btn" type="button" id="x">Cerrar</button></div>`;
  document.body.appendChild(overlay); $('#x').onclick=closeOverlay; $('#x').focus(); }
function askReset(){ if(S.screen==='intro'){reset();return;} closeOverlay(); overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`<div class="box" role="dialog" aria-label="Reiniciar"><h2 style="font-size:clamp(26px,2.6vw,44px)">¿Reiniciar el juego?</h2>
  <p class="lead">Se pierde la partida y el tiempo vuelve a ${fmt(GAME.seconds)}.</p><div class="actions"><button class="btn" type="button" id="y">Reiniciar <kbd>R</kbd></button>
  <button class="btn green" type="button" id="n">Seguir jugando <kbd>Esc</kbd></button></div></div>`;
  document.body.appendChild(overlay); confirmReset=true; $('#y').onclick=reset; $('#n').onclick=closeOverlay; $('#n').focus(); }
$('#bPause').onclick=togglePause; $('#bSound').onclick=toggleSound; $('#bFull').onclick=toggleFull; $('#bHelp').onclick=showHelp; $('#bReset').onclick=askReset;

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toLowerCase(), inRange=e.target.type==='range';
  if(overlay){ if(k==='escape') closeOverlay(); else if(k==='r'&&confirmReset) reset(); return; }
  if(k==='escape'){ if(S.open) leavePanel(); return; }
  if(k==='p') return togglePause(); if(k==='s') return toggleSound(); if(k==='f') return toggleFull(); if(k==='?') return showHelp(); if(k==='r') return askReset();
  if(S.paused) return;
  if(M.kind==='path'&&k.startsWith('arrow')){ e.preventDefault(); return runDir({arrowup:'u',arrowdown:'d',arrowleft:'l',arrowright:'r'}[k]); }
  if(k===' '&&M.kind==='co2'&&M.phase==='spray'){ e.preventDefault(); if(!e.repeat) sprayStart(); return; }
  if(k===' '){ if(e.target.tagName==='BUTTON'&&e.target.id!=='take'&&!S.open) return; e.preventDefault();
    if(S.screen==='intro') return; if(M.take) return M.take(); if(S.screen==='win'||S.screen==='lose') return go('summary'); return; }
  if(k==='enter'){ if(M.kind==='clima'){e.preventDefault();return checkClima();} if(M.kind==='kit'){e.preventDefault();return checkKit();} if(M.kind==='rail'){e.preventDefault();return checkRail();} if(M.kind==='fire'){e.preventDefault();return checkFire();} if(M.kind==='code'){e.preventDefault();return checkCode();} return; }
  if(inRange) return;
  if(k==='backspace'&&M.kind==='code'){ e.preventDefault(); return key('⌫'); }
  if(!/^[0-9]$/.test(k)) return;
  const n=+k;
  if(S.screen==='intro'){ const sc=Object.values(SCENES).find(x=>x.key===k); if(sc) startGame(sc.id); return; }
  if(S.screen==='room'&&!S.open){ const h=SC.hots[n-1]; if(h) openGame(h.id); return; }
  if(M.kind==='elec'){ const b=document.querySelectorAll('#opts .chip')[n-1]; if(b) pickRule(b); }
  else if(M.kind==='signs'){ const b=document.querySelectorAll('#opts .chip')[n-1]; if(b) pickSign(b); }
  else if(M.kind==='co2'){ const b=document.querySelectorAll('#exts .ext')[n-1]; if(b) pickExt(b); }
  else if(M.kind==='kit'){ const b=document.querySelectorAll('#opts .chip')[n-1]; if(b) toggleKit(b); }
  else if(M.kind==='shelf'){ const b=document.querySelectorAll('#boxes .chip')[n-1]; if(b) pickBox(b); }
  else if(M.kind==='fire'){ const b=document.querySelectorAll('#opts .chip')[n-1]; if(b) toggleFire(b); }
  else if(M.kind==='code'){ key(String(n)); }
  else if(M.kind==='push'){ const b=document.querySelectorAll('#opts .chip')[n-1]; if(b) push(b); }
});

document.addEventListener('keyup',e=>{ if(e.key===' '&&M.kind==='co2') sprayStop(); });

/* conservar la partida si la página se actualiza mientras está abierta */
function start(){ render(); setPauseLayer(); requestAnimationFrame(tick); }
start();
</script>

</body>
</html>
